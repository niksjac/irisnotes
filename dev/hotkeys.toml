# IrisNotes Hotkey Configuration
# 
# This file contains user-customizable keyboard shortcuts.
# Only include hotkeys you want to override - missing entries use defaults.
# 
# Format:
#   [actionName]
#   key = "modifier+key"
#   description = "Human-readable description"
#   category = "Category for grouping in UI"
#   global = true  # Whether hotkey works when editor is focused

# Layout: Ctrl+1–9 toggle the window parts (defaults, see hotkeys-template.toml)

# Tabs
[closeTab]
key = "ctrl+w"
description = "Close Active Tab"
category = "Tabs"
global = true

[moveTabLeft]
key = "ctrl+shift+alt+left"
description = "Move Tab Left"
category = "Tabs"
global = true

[moveTabRight]
key = "ctrl+shift+alt+right"
description = "Move Tab Right"
category = "Tabs"
global = true

# Panes
[toggleDualPane]
key = "ctrl+alt+d"
description = "Toggle Dual Pane Mode"
category = "Panes"
global = true

[paneResizeLeft]
key = "alt+comma"
description = "Resize Pane Left"
category = "Panes"
global = true

[paneResizeRight]
key = "alt+period"
description = "Resize Pane Right"
category = "Panes"
global = true

# Sidebar
[sidebarResizeLeft]
key = "ctrl+comma"
description = "Resize Sidebar Left"
category = "Sidebar"
global = true

[sidebarResizeRight]
key = "ctrl+period"
description = "Resize Sidebar Right"
category = "Sidebar"
global = true

# Focus
[focusPane1]
key = "ctrl+alt+1"
description = "Focus Pane 1"
category = "Focus"
global = true

[focusPane2]
key = "ctrl+alt+2"
description = "Focus Pane 2"
category = "Focus"
global = true

[focusTreeView]
key = "f8"
description = "Focus Tree View"
category = "Focus"
global = true

[focusEditor]
key = "f10"
description = "Focus Editor"
category = "Focus"
global = true

[toggleEditorTreeFocus]
key = "f6"
description = "Toggle Focus: Editor ↔ Tree View"
category = "Focus"
global = true

[focusToolbar]
key = "f7"
description = "Focus Toolbar"
category = "Focus"
global = true

[focusEditorTitle]
key = "ctrl+t"
description = "Focus Note Title / Tree View"
category = "Focus"
global = true

[focusTabBar]
key = "ctrl+alt+o"
description = "Focus Tab Bar"
category = "Focus"
global = true

# Tab Movement
[moveTabToPaneLeft]
key = "ctrl+alt+left"
description = "Move Tab to Left Pane"
category = "Tab Movement"
global = true

[moveTabToPaneRight]
key = "ctrl+alt+right"
description = "Move Tab to Right Pane"
category = "Tab Movement"
global = true

# Tab Navigation
[focusNextTab]
key = "ctrl+tab"
description = "Focus Next Tab"
category = "Tab Navigation"
global = true

[focusPreviousTab]
key = "ctrl+shift+tab"
description = "Focus Previous Tab"
category = "Tab Navigation"
global = true

# Editor
[toggleEditorView]
key = "ctrl+e"
description = "Toggle Editor View (Rich/Source)"
category = "Editor"
global = true

[toggleLineWrapping]
key = "alt+z"
description = "Toggle Line Wrapping"
category = "Editor"
global = true

# Views
[openSettings]
key = "ctrl+shift+comma"
description = "Open Settings"
category = "Views"
global = true

[openHotkeys]
key = "ctrl+shift+period"
description = "Open Keyboard Shortcuts"
category = "Views"
global = true

# Notes
[newNote]
key = "ctrl+n"
description = "New Note (at root)"
category = "Notes"
global = true

[newNoteWithLocation]
key = "ctrl+alt+n"
description = "New Note (pick location)"
category = "Notes"
global = true

# App
[reloadWindow]
key = "ctrl+shift+r"
description = "Reload Window"
category = "App"
global = true

# Editor Keybindings (ProseMirror)
# Override rich text editor shortcuts using ProseMirror key notation.
# Mod- = Ctrl on Linux/Windows, Cmd on Mac. Only include keys to override.
# See hotkeys-template.toml for all available editor keybinding IDs.
#
# New formatting shortcuts (defaults):
#   Ctrl+Shift+1-4 = Open color/font pickers
#   Ctrl+\        = Clear all formatting
#   Alt+1-9       = Quick text colors (matches grid position: Black,DkGray,Gray,LtGray,Red,Orange,Yellow,Green,Blue)
#   Alt+0         = Clear all formatting
#   Shift+Alt+1-9 = Quick highlights (matches grid position: LtYellow,Yellow,Amber,Orange,Pink,Rose,Lavender,Blue,Mint)
#   Shift+Alt+0   = Remove highlight
#
# [editor]
# bold = "Mod-b"
# bulletList = "Alt-l"
