# =============================================================================
# Editor Keybindings (ProseMirror)
# =============================================================================
#
# Override rich text editor shortcuts. Only include keys you want to change.
# Uses ProseMirror key notation (Mod- = Ctrl/Cmd, hyphen-separated).
#
# [editor]
# # Formatting
# bold = "Mod-b"
# italic = "Mod-i"
# code = "Mod-`"
# underline = "Mod-u"
# strikethrough = "Mod-Shift-s"
# linkify = "Mod-Shift-l"
# copyFormatting = "Shift-Alt-c"   # format painter: then select or click the target
# applyFormatting = "Shift-Alt-v"  # apply the copied formatting again
#
# # Blocks
# paragraph = "Mod-Shift-0"
# bulletList = "Alt-l"
# orderedList = "Alt-o"
# blockquote = "Mod-Shift-."
# codeBlock = "Mod-Shift-c"
#
# # Tables
# insertTable = "Shift-Alt-t"
#
# # Alignment (table position when the cursor is in a table)
# alignLeft = "Shift-Alt-l"
# alignCenter = "Shift-Alt-e"
# alignRight = "Shift-Alt-r"
#
# # Indentation (Mod key shortcuts; Tab/Shift-Tab always work too)
# indent = "Mod-]"
# outdent = "Mod-["
#
# # Line Operations
# moveLineUp = "Alt-ArrowUp"
# moveLineDown = "Alt-ArrowDown"
# copyLineUp = "Shift-Alt-ArrowUp"
# copyLineDown = "Shift-Alt-ArrowDown"
# selectWord = "Mod-d"
# selectPrevious = "Mod-Shift-d"
# deleteLine = "Shift-Delete"
# smartSelectAll = "Mod-a"
# cycleCase = "Shift-F3"
#
# # History
# undo = "Mod-z"
# redo = "Mod-y"
#
# # Search
# findInNote = "Mod-f"
#
# # Format Pickers (open floating picker near cursor)
# textColorPicker = "Mod-Shift-1"    # Text color picker
# highlightPicker = "Mod-Shift-2"    # Highlight color picker
# fontSizePicker = "Mod-Shift-3"     # Font size picker
# fontFamilyPicker = "Mod-Shift-4"   # Font family picker
# clearFormatting = "Mod-\\"          # Clear all formatting (Ctrl+\)
#
# # Quick Text Colors (Alt+number, positional matching grid order)
# textColor1 = "Alt-1"               # Black
# textColor2 = "Alt-2"               # Dark Gray
# textColor3 = "Alt-3"               # Gray
# textColor4 = "Alt-4"               # Light Gray
# textColor5 = "Alt-5"               # Red
