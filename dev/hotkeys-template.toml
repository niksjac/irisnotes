# IrisNotes Hotkey Configuration Template
# 
# Copy this file to 'hotkeys.toml' and customize only the hotkeys you want to change.
# You don't need to include all hotkeys - missing entries will use defaults.
#
# Key format for app hotkeys:
#   - Modifiers: ctrl, shift, alt, meta (Command on Mac)
#   - Special keys: comma, period, tab, enter, escape, space, delete, backspace
#   - Arrow keys: up, down, left, right (or arrowup, arrowdown, etc.)
#   - Function keys: f1, f2, etc.
#
# Examples:
#   key = "ctrl+s"           # Ctrl+S
#   key = "ctrl+shift+n"     # Ctrl+Shift+N
#   key = "alt+comma"        # Alt+,
#   key = "ctrl+alt+1"       # Ctrl+Alt+1
#
# Key format for [editor] section (ProseMirror keybindings):
#   Uses ProseMirror key notation where Mod = Ctrl (Linux/Win) or Cmd (Mac)
#   - Modifiers: Mod-, Shift-, Alt-  (hyphen-separated)
#   - Arrow keys: ArrowUp, ArrowDown, ArrowLeft, ArrowRight
#   - Special: Delete, Backspace, Enter, Escape, Tab, Space
#
# Examples:
#   bold = "Mod-b"               # Ctrl+B / Cmd+B
#   strikethrough = "Mod-Shift-s"  # Ctrl+Shift+S
#   moveLineUp = "Alt-ArrowUp"    # Alt+↑

# =============================================================================
# Layout (Ctrl+1 through Ctrl+8 show/hide one part of the window each;
# the window title bar has no toggle — only zen mode hides it)
# =============================================================================

[toggleAppToolbar]
key = "ctrl+1"
description = "Toggle Toolbar"
category = "Layout"
global = true

[toggleSidebar]
key = ["ctrl+2", "ctrl+g"]  # several keys: an array (or "ctrl+2,ctrl+g")
description = "Toggle Notes Sidebar"
category = "Layout"
global = true

[toggleStatusBar]
key = "ctrl+3"
description = "Toggle Status Bar"
category = "Layout"
global = true

[toggleTabBar]
key = "ctrl+4"
description = "Toggle Tab Bar"
category = "Layout"
global = true

[toggleToolbar]
key = "ctrl+5"
description = "Toggle Formatting Toolbar"
category = "Layout"
global = true

[toggleTitleBar]
key = "ctrl+6"
description = "Toggle Note Title Bar"
category = "Layout"
global = true

[toggleMetadataBar]
key = "ctrl+7"
description = "Toggle Note Info Bar"
category = "Layout"
global = true

[toggleNoteConfigBar]
key = "ctrl+8"
description = "Toggle Note Hotkey Bar"
category = "Layout"
global = true

